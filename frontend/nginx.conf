server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Defence in depth: even if HTML were ever injected, the browser would refuse
    # inline scripts and event handlers such as onerror=.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The dashboard calls relative /api URLs; forward them to the API container.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
