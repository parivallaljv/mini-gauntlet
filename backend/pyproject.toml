[project]
name = "mini-gauntlet"
version = "0.1.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]
# UP038 (X | Y in isinstance) is deprecated in Ruff and slower at runtime.
ignore = ["UP038"]

[tool.pytest.ini_options]
testpaths = ["tests"]
